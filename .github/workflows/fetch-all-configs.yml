name: Fetch all configs

"on":
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fetch-all-configs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      botasaurus:
        image: html2rss/botasaurus-scrape-api:latest
        ports:
          - 4010:4010

    env:
      BOTASAURUS_SCRAPER_URL: http://localhost:4010
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Wait for Botasaurus
        run: |
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$BOTASAURUS_SCRAPER_URL")" != "000" ] && exit 0
            sleep 2
          done
          echo "::warning::Botasaurus did not answer; its configs will fail this week."

      - name: Fetch every config
        id: report
        run: |
          gh issue list --label fetch-report --state all --limit 1 --json body --jq '.[0].body // ""' > previous.md
          echo "status=$(bundle exec bin/fetch_report --previous previous.md --out report.md --progress)" >> "$GITHUB_OUTPUT"

      - name: Publish the report issue
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          { echo "Run: $RUN_URL"; echo; cat report.md; } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --label fetch-report --state all --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$issue" ]; then
            [ "$STATUS" = clear ] && exit 0
            gh label create fetch-report --color BFD4F2 --description "Weekly config fetch report" 2>/dev/null || true
            gh issue create --label fetch-report --title "Weekly config fetch report" --body-file body.md
            exit 0
          fi

          gh issue edit "$issue" --body-file body.md
          if [ "$STATUS" = clear ]; then
            gh issue close "$issue" --comment "Nothing failing or stale in $RUN_URL." 2>/dev/null || true
          else
            gh issue reopen "$issue" 2>/dev/null || true
          fi
