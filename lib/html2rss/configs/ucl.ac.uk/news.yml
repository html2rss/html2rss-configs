# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - research
    - science
  title: "UCL — News Highlights"
  summary: "Interdisciplinary science, public health findings, and academic publications from University College London."

channel:
  title: "UCL — News Highlights"
  url: https://www.ucl.ac.uk/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: "article"
    enhance: false
  title:
    selector: "h1, h2, h3, h4, h5, h6"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
