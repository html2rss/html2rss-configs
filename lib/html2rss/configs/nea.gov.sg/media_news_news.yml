# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - environment
    - civic
  title: "National Environment Agency Singapore — News"
  summary: "Air quality monitoring, waste reduction, carbon tax administration, and dengue prevention."

channel:
  title: "National Environment Agency Singapore — News"
  url: https://www.nea.gov.sg/media/news/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="list"] > li'
    enhance: false
  title:
    selector: "a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
