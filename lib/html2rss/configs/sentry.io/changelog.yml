# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - product
  title: "Sentry — Changelog"
  summary: "Application monitoring, error tracking, and performance tracing."

channel:
  title: "Sentry — Changelog"
  url: https://sentry.io/changelog/
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="list"] > li'
    enhance: false
  title:
    selector: "a"
  url:
    selector: "a"
    extractor: href
  published_at:
    selector: "time"
