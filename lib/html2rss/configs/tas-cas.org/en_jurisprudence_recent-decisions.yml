# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - sports
    - civic
  title: "Court of Arbitration for Sport — Decisions & News"
  summary: "Arbitration awards, Olympic disputes, and sports jurisprudence from CAS Lausanne."

channel:
  title: "Court of Arbitration for Sport — Decisions & News"
  url: https://www.tas-cas.org/en/jurisprudence/recent-decisions
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'a[href$=".pdf"]'
    enhance: false
  title:
    selector: ".quick-link-text"
  url:
    extractor: href
    post_process:
      - name: gsub
        pattern: "/en/jurisprudence/generated"
        replacement: "/generated"
  enclosure:
    extractor: href
    content_type: application/pdf
    post_process:
      - name: gsub
        pattern: "/en/jurisprudence/generated"
        replacement: "/generated"
