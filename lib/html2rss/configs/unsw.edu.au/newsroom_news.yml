# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - research
    - science
  title: "UNSW Sydney — Newsroom"
  summary: "Photovoltaic engineering, clean energy, and medical research from UNSW Sydney."

channel:
  title: "UNSW Sydney — Newsroom"
  url: https://www.unsw.edu.au/newsroom/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="news"] > li'
    enhance: false
  title:
    selector: "a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
