# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - research
  title: "Technical University of Munich — Press Releases"
  summary: "Robotics, aerospace, green tech, and engineering breakthroughs from TU Munich Germany."

channel:
  title: "Technical University of Munich — Press Releases"
  url: https://www.tum.de/en/news-and-events/all-news/press-releases
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="news"] > li'
    enhance: false
  title:
    selector: "a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
