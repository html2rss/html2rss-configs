# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - product
  title: "Qwik — Blog"
  summary: "Resumable web application framework, zero hydration overhead, and web performance from Qwik."

channel:
  title: "Qwik — Blog"
  url: https://qwik.dev/blog/
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: "article"
    enhance: false
  title:
    selector: "h1, h2, h3, h4, h5, h6"
  url:
    selector: "a"
    extractor: href
  published_at:
    selector: "time"
