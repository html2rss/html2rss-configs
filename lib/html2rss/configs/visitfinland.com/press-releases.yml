# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - travel
strategy: botasaurus
channel:
  url: https://media.visitfinland.com/en/media-press-releases/
  language: en
  time_zone: Europe/Helsinki
  ttl: 360
request:
  botasaurus:
    wait_for_selector: 'a[href*="/en/media-press-releases/"]'
    wait_timeout_seconds: 20
selectors:
  items:
    selector: 'a.PageCard[href*="/en/media-press-releases/"]'
    enhance: true
  title:
    selector: div.h5
  url:
    extractor: href
