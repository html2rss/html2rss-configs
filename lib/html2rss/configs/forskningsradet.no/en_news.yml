# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - science
    - research
  title: "Research Council of Norway — News"
  summary: "Norwegian national scientific funding, green transition grants, and research policy."

channel:
  title: "Research Council of Norway — News"
  url: https://www.forskningsradet.no/en/news/
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="list"] > li'
    enhance: false
  title:
    selector: "h1, h2, h3, h4, h5, h6"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
