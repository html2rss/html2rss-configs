# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - research
  title: "Anthropic — News"
  summary: "Product and research announcements from Anthropic."
channel:
  title: "Anthropic — News"
  url: https://www.anthropic.com/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'li[data-listing-row^="article-"]'
    enhance: false
  title:
    selector: 'a[class*="__title-link"] h3, h3'
  description:
    selector: 'div[class*="__description"] p'
  url:
    selector: 'a[class*="__title-link"]'
    extractor: href
  published_at:
    selector: "time"
  categories:
    - category
  category:
    selector: 'div[class*="__category"] a'
