# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - product
  title: "Resend — Changelog"
  summary: "Email API infrastructure releases, deliverability updates, and SDK changelogs."

channel:
