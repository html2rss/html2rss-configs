# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - tech
    - product
  title: "ASML — Press releases"
  summary: "Corporate press releases from semiconductor equipment maker ASML."
strategy: botasaurus

channel:
  title: "ASML — Press releases"
  url: https://investor.asml.com/news/press-releases-and-announcements
  language: en
  time_zone: Europe/Amsterdam
  ttl: 360
selectors:
  items:
    selector: div.node--nir-news--nir-widget-list
    enhance: false
  title:
    selector: .nir-widget--news--headline a
  url:
    selector: .nir-widget--news--headline a
    extractor: href
  published_at:
    selector: .nir-widget--news--date-time
