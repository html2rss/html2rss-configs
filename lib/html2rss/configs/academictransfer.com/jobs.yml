# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - jobs
strategy: botasaurus
channel:
  url: https://www.academictransfer.com/en/jobs/
  language: en
  time_zone: Europe/Amsterdam
  ttl: 360
request:
  botasaurus:
    wait_for_selector: 'article a[href*="/en/jobs/"]'
    wait_timeout_seconds: 20
selectors:
  items:
    selector: article
    enhance: false
  title:
    selector: h3
  url:
    selector: 'a[href*="/en/jobs/"]'
    extractor: href
