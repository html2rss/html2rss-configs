# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - consumer
    - civic
  title: "European Commission Competition — News"
  summary: "Competition decisions from the European Commission: antitrust and cartel fines, merger rulings, state aid and foreign subsidies cases."

channel:
  title: "European Commission Competition — News"
  url: https://competition-policy.ec.europa.eu/about/news_en
  language: en
  time_zone: Europe/Brussels
  ttl: 720
selectors:
  items:
    selector: "article.ecl-content-item"
    enhance: false
  title:
    selector: ".ecl-content-block__title a"
    extractor: text
  url:
    selector: ".ecl-content-block__title a"
    extractor: href
  published_at:
    selector: "time"
    extractor: attribute
    attribute: datetime
