# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - news
    - sports
  title: "Deutscher Aero Club — News"
  summary: "Aktuelle Meldungen des Deutschen Aero Clubs zu Luftsport, Verbandsarbeit und Luftraum."
channel:
  title: "Deutscher Aero Club — News"
  url: https://www.daec.de/news/
  language: de
  time_zone: Europe/Berlin
  ttl: 720
selectors:
  items:
    selector: "div.article[itemtype*='Article']"
    enhance: false
  title:
    selector: ".news-header h3 a"
  url:
    selector: ".news-header h3 a"
    extractor: href
  description:
    selector: ".teaser-text [itemprop='description']"
  published_at:
    selector: ".news-list-date time"
    extractor: attribute
    attribute: datetime
    post_process:
      - name: parse_time
