# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - news
    - civic
  title: "NTSB — Press releases"
  summary: "Press releases from the US National Transportation Safety Board across all transport modes."
channel:
  title: "NTSB — Press releases"
  url: https://www.ntsb.gov/news/press-releases/Pages/default.aspx
  language: en
  time_zone: America/New_York
  ttl: 720
selectors:
  items:
    selector: "#newsLanding .news-feed > .box"
    enhance: false
  title:
    selector: ".inner h3"
  url:
    selector: "a.link-more"
    extractor: href
  description:
    selector: ".inner h4"
  published_at:
    selector: ".time p"
    post_process:
      - name: parse_time
