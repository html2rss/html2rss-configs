# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - research
    - science
  title: "King's College London — News"
  summary: "Biomedical research, international affairs analysis, and academic news from King's College London."

channel:
  title: "King's College London — News"
  url: https://www.kcl.ac.uk/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: "article"
    enhance: false
  title:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
