# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - travel
  title: "Booking.com — Travel articles"
  summary: "Destination guides, itineraries and travel tips from Booking.com."
strategy: botasaurus

channel:
  title: "Booking.com — Travel articles"
  url: https://www.booking.com/articles.html
  language: en
  time_zone: UTC
  ttl: 1440
selectors:
  items:
    selector: "a[href*='/articles/']:has(h3)"
    enhance: false
  title:
    selector: "h3"
  url:
    extractor: href
    post_process:
      - name: gsub
        pattern: "/\\?.*\\z/"
        replacement: ""
