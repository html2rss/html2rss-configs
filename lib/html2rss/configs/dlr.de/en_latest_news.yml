# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - science
    - research
  title: "DLR — News & Highlights"
  summary: "Aeronautics, space, energy, and transport research highlights from the German Aerospace Center."

channel:
  title: "DLR — News & Highlights"
  url: https://www.dlr.de/en/latest/news
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'div[class*="item"]'
    enhance: false
  title:
    selector: "a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
