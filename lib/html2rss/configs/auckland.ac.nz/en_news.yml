# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
directory:
  topics:
    - research
    - science
  title: "University of Auckland — News Highlights"
  summary: "New Zealand marine biology, indigenous research, and technology from Auckland."

channel:
  title: "University of Auckland — News Highlights"
  url: https://www.auckland.ac.nz/en/news.html
  language: en
  time_zone: UTC
  ttl: 360
selectors:
  items:
    selector: 'ul[class*="news"] > li'
    enhance: false
  title:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
  url:
    selector: "h1 a, h2 a, h3 a, h4 a, h5 a, h6 a"
    extractor: href
  published_at:
    selector: "time"
